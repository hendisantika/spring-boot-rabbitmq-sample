# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # required to submit the dependency graph
    strategy:
      fail-fast: false
      matrix:
        module: [ producer, consumer ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Build with Maven for ${{ matrix.module }}
        run: mvn -B -ntp verify --file ./${{ matrix.module }}/pom.xml

      # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: advanced-security/maven-dependency-submission-action@v6.0.1
        with:
          directory: ${{ matrix.module }}
          correlator: ${{ github.job }}-${{ matrix.module }}
