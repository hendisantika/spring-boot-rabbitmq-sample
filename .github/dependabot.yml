version: 2

updates:
  # ---------------------------------------------------------------------------
  # Maven - producer
  # ---------------------------------------------------------------------------
  - package-ecosystem: maven
    directory: "/producer"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    assignees:
      - hendisantika
    labels:
      - dependencies
      - java
      - producer
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      spring:
        patterns:
          - "org.springframework*"
        exclude-patterns:
          - "org.springframework.boot*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
          - "*maven-plugin"
      minor-and-patch:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # Maven - consumer
  # ---------------------------------------------------------------------------
  - package-ecosystem: maven
    directory: "/consumer"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    assignees:
      - hendisantika
    labels:
      - dependencies
      - java
      - consumer
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      spring:
        patterns:
          - "org.springframework*"
        exclude-patterns:
          - "org.springframework.boot*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
          - "*maven-plugin"
      minor-and-patch:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    assignees:
      - hendisantika
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci(deps)"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
